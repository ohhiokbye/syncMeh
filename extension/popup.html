<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncMeh</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-title">SyncMeh</span>
          <span class="brand-subtitle">YT Music Sync</span>
        </div>
      </div>
      <div id="statusPill" class="status-pill status-disconnected">
        <span class="status-dot"></span>
        <span id="statusLabel">Offline</span>
      </div>
    </header>

    <!-- Now Playing Card -->
    <div class="card now-playing">
      <div class="track-icon-wrapper">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
      </div>
      <div class="track-details">
        <span class="section-tag">NOW PLAYING</span>
        <h4 id="trackTitle" class="track-title">No track detected</h4>
        <p id="trackArtist" class="track-artist">Open music.youtube.com</p>
      </div>
    </div>

    <!-- Room Management -->
    <div class="card room-card">
      <label for="roomInput" class="field-label">ROOM SESSION</label>
      
      <div class="input-group">
        <input 
          type="text" 
          id="roomInput" 
          class="room-input" 
          placeholder="e.g. room123" 
          spellcheck="false" 
          autocomplete="off"
          maxlength="30"
        />
        <button id="copyBtn" class="icon-action-btn" title="Copy room code" aria-label="Copy">
          <svg id="copyIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <svg id="checkIcon" class="hidden text-success" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>

      <div class="button-row">
        <button id="joinBtn" class="btn btn-primary">
          <span>Join Session</span>
        </button>
        <button id="randomBtn" class="btn btn-ghost" title="Generate random room ID">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          <span>Random</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-status">
        <span class="meta-label">Active:</span>
        <span id="currentRoomText" class="room-tag">room123</span>
      </div>
      <span class="engine-tag">STOMP / WS</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
